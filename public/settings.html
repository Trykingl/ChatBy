<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>Settings</h1>
    </div>
    <div class="settings-list">
      <div class="settings-item">
        <span class="icon">👤</span>
        <div class="settings-info">
          <span class="title">Account</span>
          <span class="subtitle">Privacy, security, change account</span>
        </div>
      </div>
      <div class="settings-item">
        <span class="icon">💬</span>
        <div class="settings-info">
          <span class="title">Chats</span>
          <span class="subtitle">Theme, wallpaper, chat history</span>
        </div>
      </div>
      <div class="settings-item">
        <span class="icon">🔔</span>
        <div class="settings-info">
          <span class="title">Notifications</span>
          <span class="subtitle">Message, group & call tones</span>
        </div>
      </div>
      <div class="settings-item">
        <span class="icon">ℹ️</span>
        <div class="settings-info">
          <span class="title">About ChatBy</span>
          <span class="subtitle">Version 1.0.0</span>
        </div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item">
        <span class="icon">💬</span>
        <span>Chats</span>
      </div>
      <div class="nav-item active">
        <span class="icon">⚙️</span>
        <span>Settings</span>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
