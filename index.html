<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBy</title>
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>Chat<span>By</span></h1>
      <input type="text" placeholder="Search">
    </div>
    <div class="chat-list">
      <div class="chat-item">
        <img src="..." class="avatar">
        <div class="chat-info">
          <span class="name">Spamton</span>
          <span class="preview">pepis</span>
        </div>
        <div class="chat-meta">
          <span class="time">15:13</span>
          <span class="badge">2</span>
        </div>
      </div>
      <div class="chat-item">
        <img src="..." class="avatar">
        <div class="chat-info">
          <span class="name">Sans</span>
          <span class="preview">you're gonna have a bad...</span>
        </div>
        <div class="chat-meta">
          <span class="time">19:03</span>
          <span class="badge">1</span>
        </div>
      </div>
      <div class="chat-item">
        <img src="..." class="avatar">
        <div class="chat-info">
          <span class="name">Jax</span>
          <span class="preview">oh no they killed zooble</span>
        </div>
        <div class="chat-meta">
          <span class="time">10:21</span>
          <span class="badge">3</span>
        </div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item active">
        <span class="icon">💬</span>
        <span>Chats</span>
      </div>
      <div class="nav-item">
        <span class="icon">⚙️</span>
        <span>Settings</span>
      </div>
    </div>
  </div>
</body>

</html>
